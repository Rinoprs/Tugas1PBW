<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SITTA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<main class="login-box card">
    <img src="assets/logo-ut.png" alt="Logo UT" style="width:200px;display:block;margin:0 auto">
  <h1>Selamat Datang</h1>
  <form id="formLogin" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Masukan email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Masukan Password">
    <p class="error" id="pesanError"></p>
     <button type="submit" class="btn" id="btnLogin" style="width:100%">Login</button>
  </form>
  <div class="login-links">
    <button class="link-btn" id="btnLupa">Lupa Password</button>
    <button class="link-btn" id="btnDaftar">Daftar</button>
  </div>
</main>
<div class="modal" id="modalLupa"><div class="modal-isi">
  <h2>Lupa Password</h2>
  <label for="emailLupa">Email terdaftar</label><input type="email" id="emailLupa">
  <button class="btn" id="kirimLupa">Kirim</button>
  <button class="link-btn" data-tutup="modalLupa">Tutup</button>
</div></div>
<div class="modal" id="modalDaftar"><div class="modal-isi">
  <h2>Daftar Akun</h2>
  <label for="namaDaftar">Nama</label><input type="text" id="namaDaftar">
  <label for="emailDaftar">Email</label><input type="email" id="emailDaftar">
  <label for="passDaftar">Password</label><input type="password" id="passDaftar">
  <button class="btn" id="kirimDaftar">Daftar</button>
  <button class="link-btn" data-tutup="modalDaftar">Tutup</button>
</div></div>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
